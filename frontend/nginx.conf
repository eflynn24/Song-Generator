server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 1200s;
    client_max_body_size 50m;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

